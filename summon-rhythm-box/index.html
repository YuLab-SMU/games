// Update follower positions (trail behind player)
function updateFollowers(dt) {
  // Record path
  const PATH_INTERVAL = 2; // record path more frequently
  if (!state._pathCounter) state._pathCounter = 0;
  state._pathCounter += dt * 60;
  if (state._pathCounter >= PATH_INTERVAL) {
    state._pathCounter -= PATH_INTERVAL;
    state.pathHistory.push({ x: player.x, y: player.y });
    // Keep limited history
    const maxHistory = state.followers.length * PATH_INTERVAL + 30;
    while (state.pathHistory.length > maxHistory) state.pathHistory.shift();
  }

  state._huntRetargetTimer -= dt;
  if (state.squadMode === 'hunt' && state._huntRetargetTimer <= 0) {
    const claimed = new Set();
    const activeHunters = Math.min(HUNT_TARGET_LIMIT, state.followers.length);
    for (let i = 0; i < activeHunters; i++) {
      const f = state.followers[i];
      let best = null, bestDist = Infinity;
      for (const a of aiChars) {
        if (claimed.has(a) || a.level > f.level) continue;
        const dist = (a.x - f.x) ** 2 + (a.y - f.y) ** 2;
        if (dist < bestDist) { best = a; bestDist = dist; }
      }
      f.huntTarget = best;
      if (best) claimed.add(best);
    }
    for (let i = activeHunters; i < state.followers.length; i++) state.followers[i].huntTarget = null;
    state._huntRetargetTimer = 0.25;
  }
  
  // Each follower follows 12 steps behind the previous
  const FOLLOW_DIST = 5; // in history points (was 12, tighter follow)
  for (let i = 0; i < state.followers.length; i++) {
    const f = state.followers[i];
    const histIdx = state.pathHistory.length - 1 - ((i + 1) * FOLLOW_DIST);
    if (histIdx >= 0) {
      const target = state.pathHistory[Math.max(0, histIdx)];
      let tx = target.x, ty = target.y;
      if (state.squadMode === 'guard') {
        const a = (i / Math.max(1, state.followers.length)) * Math.PI * 2;
        tx = player.x + Math.cos(a) * (player.size * 2.2 + i * 2);
        ty = player.y + Math.sin(a) * (player.size * 2.2 + i * 2);
      } else if (state.squadMode === 'hunt') {
        const target = f.huntTarget;
        if (target && aiChars.includes(target) && target.level <= f.level) { tx = target.x; ty = target.y; }
      }
      const dx = tx - f.x;
      const dy = ty - f.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 2) {
        const speed = Math.min(400, dist * 5);
        f.x += (dx / dist) * speed * dt;
        f.y += (dy / dist) * speed * dt;
      }
    }
    f.bobPhase += dt * 3;
  }
}

// Also let followers eat AI they touch
function checkFollowerCollisions() {
  if (state._autoEatCooldown > 0) return;
  const cellSize = 140;
  const buckets = new Map();
  for (const a of aiChars) {
    const key = `${Math.floor(a.x / cellSize)},${Math.floor(a.y / cellSize)}`;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(a);
  }
  followerLoop:
  for (let fi = state.followers.length - 1; fi >= 0; fi--) {
    const f = state.followers[fi];
    const cx = Math.floor(f.x / cellSize), cy = Math.floor(f.y / cellSize);
    const nearby = [];
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) nearby.push(...(buckets.get(`${cx + ox},${cy + oy}`) || []));
    for (const a of nearby) {
      const ai = aiChars.indexOf(a);
      if (ai < 0) continue;
      const dx = f.x - a.x, dy = f.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < f.size + a.size - 4 && a.level <= f.level) {
        // Follower eats the AI
        state.totalEats++;
        state.score += (a.level + 1) * 5;
        spawnEatParticles(a.x, a.y, LEVELS[a.level]?.accent || '#fff');
        
        // Eaten AI joins as new follower
        const nl = LEVELS[a.level];
        if (state.followers.length < MAX_FOLLOWERS) {
          state.followers.push({
            level: a.level,
            x: a.x, y: a.y,
            targetX: f.x, targetY: f.y,
            size: nl.size, color: nl.color, dark: nl.dark, accent: nl.accent,
            role: nl.role, name: nl.name,
            bobPhase: Math.random() * Math.PI * 2,
          });
        }
        aiChars.splice(ai, 1);
        sfxEat(f.level);
        checkFollowerMerge();
        state._autoEatCooldown = state.squadMode === 'guard' ? 0.18 : state.squadMode === 'hunt' ? 0.1 : 0.14;
        break followerLoop;
      }
    }
  }
}

// ==================== COLLISION DETECTION ====================
function checkCollisions() {
  if (!player || !state.running) return;
  if (state.invulnTimer > 0) return;
  
  // Player vs AI
  for (let i = aiChars.length - 1; i >= 0; i--) {
    const ai = aiChars[i];
    const dx = player.x - ai.x, dy = player.y - ai.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const touchDist = player.size + ai.size - 8;
    
    if (dist < touchDist) {
      if (ai.level <= state.playerLevel || state.gratitudeMode) {
        playerEatChar(ai);
      } else {
        playerDies(ai);
        return;
      }
    }
  }
  
  // Follower vs AI (eating chain)
  checkFollowerCollisions();
  
  // Dog head rescue
  checkDogHeadRescue();
  
  // AI vs AI bounce, limited to nearby spatial buckets
  const cellSize = 140;
  const aiBuckets = new Map();
  for (const a of aiChars) {
    const key = `${Math.floor(a.x / cellSize)},${Math.floor(a.y / cellSize)}`;
    if (!aiBuckets.has(key)) aiBuckets.set(key, []);
    aiBuckets.get(key).push(a);
  }
  for (const a of aiChars) {
    const cx = Math.floor(a.x / cellSize), cy = Math.floor(a.y / cellSize);
    const nearby = [];
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) nearby.push(...(aiBuckets.get(`${cx + ox},${cy + oy}`) || []));
    for (const b of nearby) {
      if (a === b || aiChars.indexOf(a) > aiChars.indexOf(b)) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = a.size + b.size;
      if (dist < minDist && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        a.x += nx * overlap * 0.5; a.y += ny * overlap * 0.5;
        b.x -= nx * overlap * 0.5; b.y -= ny * overlap * 0.5;
        a.vx += nx * 0.5; a.vy += ny * 0.5;
        b.vx -= nx * 0.5; b.vy -= ny * 0.5;
      }
    }
  }
}

// ==================== AI MOVEMENT ====================
function updateAI(dt) {
  for (const ai of aiChars) {
    const aiSpeed = getAISpeed(ai.level);
    const b = ai.behavior || 'wander';
    
    // Wander timer for all behaviors
    ai.wanderTimer -= dt;
    ai.dashCooldown -= dt;
    
    if (ai.wanderTimer <= 0) {
      ai.wanderTimer = 0.8 + Math.random() * 2.5;
      
      if (b === 'patrol') {
        // Patrol: keep moving in straight lines, turn at walls
        ai.wanderTimer = 1.5 + Math.random() * 3;
      } else if (b === 'dasher' && ai.dashCooldown <= 0 && player) {
        // Dasher: occasional burst toward/away from player
        ai.dashCooldown = 3 + Math.random() * 5;
        if (ai.level > state.playerLevel) {
          ai.wanderAngle = Math.atan2(player.y - ai.y, player.x - ai.x);
        } else {
          ai.wanderAngle = Math.atan2(ai.y - player.y, ai.x - player.x);
        }
        ai.wanderTimer = 0.3; // short burst
      } else if (b === 'skittish' && player) {
        // Skittish: stay near other AI, flee from player
        if (ai.level < state.playerLevel) {
          ai.wanderAngle = Math.atan2(ai.y - player.y, ai.x - player.x);
        } else {
          ai.wanderAngle = Math.random() * Math.PI * 2;
        }
      } else {
        // Wander: random direction with chase/flee bias
        ai.wanderAngle = Math.random() * Math.PI * 2;
        if (player && ai.level > state.playerLevel && Math.random() < 0.35) {
          ai.wanderAngle = Math.atan2(player.y - ai.y, player.x - ai.x);
        } else if (player && ai.level < state.playerLevel && Math.random() < 0.45) {
          ai.wanderAngle = Math.atan2(ai.y - player.y, ai.x - player.x);
        }
      }
    }
    
    // Dasher speed boost
    const speedMult = (b === 'dasher' && ai.dashCooldown > 2.8) ? 2.5 : 1;
    
    const targetVx = Math.cos(ai.wanderAngle) * aiSpeed * speedMult;
    const targetVy = Math.sin(ai.wanderAngle) * aiSpeed * speedMult;
    ai.vx += (targetVx - ai.vx) * dt * 2;
    ai.vy += (targetVy - ai.vy) * dt * 2;
    
    ai.x += ai.vx * dt;
    ai.y += ai.vy * dt;
    
    const margin = 40;
    if (ai.x < margin) { ai.x = margin; ai.vx = Math.abs(ai.vx); ai.wanderAngle = Math.random() * Math.PI - Math.PI / 2; }
    if (ai.x > state.worldW - margin) { ai.x = state.worldW - margin; ai.vx = -Math.abs(ai.vx); ai.wanderAngle = Math.PI + Math.random() * Math.PI - Math.PI / 2; }
    if (ai.y < margin) { ai.y = margin; ai.vy = Math.abs(ai.vy); ai.wanderAngle = Math.random() * Math.PI; }
    if (ai.y > state.worldH - margin) { ai.y = state.worldH - margin; ai.vy = -Math.abs(ai.vy); ai.wanderAngle = Math.PI + Math.random() * -Math.PI; }
    
    const s = Math.sqrt(ai.vx * ai.vx + ai.vy * ai.vy);
    const maxSpeed = aiSpeed * speedMult;
    if (s > maxSpeed) { ai.vx = (ai.vx / s) * maxSpeed; ai.vy = (ai.vy / s) * maxSpeed; }
    
    if (Math.abs(ai.vx) > 2 || Math.abs(ai.vy) > 2) {
      ai.angle = Math.atan2(ai.vy, ai.vx);
    }
    ai.bobPhase += dt * 3;
  }
}

// ==================== INPUT ====================
const input = { up: false, down: false, left: false, right: false, joystick: { active: false, dx: 0, dy: 0 }, tapTarget: null };

function setupInput() {
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': input.up = true; e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': input.down = true; e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': input.left = true; e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': input.right = true; e.preventDefault(); break;
      case 'Escape': case 'p': case 'P': togglePause(); e.preventDefault(); break;
      case 'f': case 'F': setSquadMode(state.squadMode === 'follow' ? 'hunt' : state.squadMode === 'hunt' ? 'guard' : 'follow'); e.preventDefault(); break;
    }
  });
  document.addEventListener('keyup', e => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': input.up = false; break;
      case 'ArrowDown': case 's': case 'S': input.down = false; break;
      case 'ArrowLeft': case 'a': case 'A': input.left = false; break;
      case 'ArrowRight': case 'd': case 'D': input.right = false; break;
    }
  });

  // Touch controls
  const isMobile = /Mobi|Android|iPhone|iPad|Tablet/i.test(navigator.userAgent) || ('ontouchstart' in window);
  const base = document.getElementById('joystick-base');
  const thumb = document.getElementById('joystick-thumb');
  const zone = document.getElementById('joystick-zone');
  
  // Always show joystick zone on touch devices
  zone.style.display = isMobile ? 'block' : 'none';
  base.style.display = 'none';
  
  let touchId = null;
  let tapTouchId = null;
  
  // TAP TO MOVE: tap anywhere on the right side or non-joystick area
  canvas.addEventListener('touchstart', e => {
    if (!state.running) return;
    for (const t of e.changedTouches) {
      // Right half of screen = tap-to-move
      if (t.clientX > window.innerWidth * 0.45 && !input.joystick.active) {
        tapTouchId = t.identifier;
        input.tapTarget = { x: t.clientX, y: t.clientY };
        e.preventDefault();
      }
    }
  }, { passive: false });
  
  canvas.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === tapTouchId) {
        input.tapTarget = { x: t.clientX, y: t.clientY };
        e.preventDefault();
      }
    }
  }, { passive: false });
  
  canvas.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === tapTouchId) {
        tapTouchId = null;
        input.tapTarget = null;
      }
    }
  });
  
  // Joystick on left side
  let joystickCX = 0, joystickCY = 0;
  zone.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (t.clientY > window.innerHeight * 0.35 && t.clientX < window.innerWidth * 0.45) {
        touchId = t.identifier;
        input.joystick.active = true;
        input.tapTarget = null;
        base.style.left = (t.clientX - 55) + 'px';
        base.style.bottom = (window.innerHeight - t.clientY - 55) + 'px';
        base.style.display = 'flex';
        // Cache joystick center (avoids getBoundingClientRect on every move)
        joystickCX = t.clientX;
        joystickCY = t.clientY;
        updateJoystickCached(t.clientX, t.clientY, t.clientX, t.clientY);
        e.preventDefault();
        break;
      }
    }
  }, { passive: false });
  
  zone.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        updateJoystickCached(joystickCX, joystickCY, t.clientX, t.clientY);
        e.preventDefault();
        break;
      }
    }
  }, { passive: false });
  
  zone.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        input.joystick.active = false;
        input.joystick.dx = 0; input.joystick.dy = 0;
        thumb.style.transform = 'translate(0, 0)';
        base.style.display = 'none';
        break;
      }
    }
  });
  
  function updateJoystickCached(baseCX, baseCY, tx, ty) {
    const dx = tx - baseCX;
    const dy = ty - baseCY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxR = 42;
    const clamped = Math.min(dist, maxR);
    const nx = dist > 0 ? (dx / dist) * clamped : 0;
    const ny = dist > 0 ? (dy / dist) * clamped : 0;
    thumb.style.transform = `translate(${nx}px, ${ny}px)`;
    input.joystick.dx = dist > 0 ? dx / dist : 0;
    input.joystick.dy = dist > 0 ? dy / dist : 0;
  }
  
  // Mouse support for desktop testing of touch features
  canvas.addEventListener('mousedown', e => {
    if (!state.running || input.joystick.active) return;
    if (e.button === 0) {
      input.tapTarget = { x: e.clientX, y: e.clientY };
    }
  });
  canvas.addEventListener('mousemove', e => {
    if (input.tapTarget) {
      input.tapTarget = { x: e.clientX, y: e.clientY };
    }
  });
  canvas.addEventListener('mouseup', () => { input.tapTarget = null; });
  canvas.addEventListener('mouseleave', () => { input.tapTarget = null; });
  
}

// ==================== UPDATE ====================
function updatePlayer(dt) {
  if (!player || !state.running) return;
  
  const speed = getPlayerSpeed();
  let mx = 0, my = 0;
  
  if (input.joystick.active) {
    mx = input.joystick.dx;
    my = input.joystick.dy;
  } else if (input.tapTarget) {
    // Convert screen tap to world direction
    const worldTx = input.tapTarget.x + state.camX - canvas.width / 2;
    const worldTy = input.tapTarget.y + state.camY - canvas.height / 2;
    const dx = worldTx - player.x;
    const dy = worldTy - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      mx = dx / dist;
      my = dy / dist;
    }
  } else {
    if (input.left) mx -= 1;
    if (input.right) mx += 1;
    if (input.up) my -= 1;
    if (input.down) my += 1;
  }
  
  // Normalize
  const mag = Math.sqrt(mx * mx + my * my);
  if (mag > 1) { mx /= mag; my /= mag; }
  
  player.x += mx * speed * dt;
  player.y += my * speed * dt;
  
  // Update player angle for drawing
  if (mag > 0.01) player.angle = Math.atan2(my, mx);
  
  // World bounds
  const m = player.size;
  if (player.x < m) player.x = m;
  if (player.x > state.worldW - m) player.x = state.worldW - m;
  if (player.y < m) player.y = m;
  if (player.y > state.worldH - m) player.y = state.worldH - m;
}

function updateCamera() {
  if (!player) {
    state.camX = state.worldW / 2;
    state.camY = state.worldH / 2;
    return;
  }
  state.camX += (player.x - state.camX) * 0.08;
  state.camY += (player.y - state.camY) * 0.08;
}

function updateHUD() {
  document.getElementById('level-name').textContent = LEVELS[state.playerLevel].name;
  document.getElementById('score-display').textContent = state.score;
  
  // Show follower count or dog rescue progress
  if (state.gluttonMode) {
    document.getElementById('target-display').textContent = `🍖 ${state.gluttonTimer.toFixed(1)}s`;
    document.getElementById('target-display').style.color = '#FF4500';
  } else if (state.gratitudeMode) {
    document.getElementById('target-display').textContent = `⏱ ${Math.ceil(state.gratitudeTimer)}s`;
    document.getElementById('target-display').style.color = '#FFD700';
  } else {
    document.getElementById('target-display').textContent = `🐕 ${state.dogRescued}/${DOG_RESCUE_TARGET}`;
    document.getElementById('target-display').style.color = '';
  }
  
  const sameLevel = state.followers.filter(f => f.level === state.playerLevel).length;
  const needed = state.playerLevel >= 10 ? 0 : 2;
  const pct = needed ? Math.min(100, (sameLevel / needed) * 100) : 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = state.playerLevel >= 10 ? '完成' : `${Math.min(sameLevel, needed)}/${needed}`;
  
  document.getElementById('prev-emoji').textContent = '📦';
  document.getElementById('next-emoji').textContent = state.playerLevel < 10 ? '📦' : '🏆';
  
  // Gratitude glow on progress bar
  const progressWrap = document.getElementById('progress-wrap');
  if (state.gluttonMode) {
    progressWrap.style.border = '2px solid #FF4500';
    progressWrap.style.boxShadow = '0 0 20px rgba(255,69,0,0.6)';
  } else if (state.gratitudeMode) {
    progressWrap.style.border = '2px solid #FFD700';
    progressWrap.style.boxShadow = '0 0 15px rgba(255,215,0,0.5)';
  } else {
    progressWrap.style.border = 'none';
    progressWrap.style.boxShadow = 'none';
  }
  
  const comboEl = document.getElementById('hud-combo');
  if (state.combo >= 2 && state.comboTime > 0) {
    comboEl.style.display = 'flex';
    document.getElementById('combo-display').textContent = 'x' + state.combo;
  } else {
    comboEl.style.display = 'none';
  }
  const beatLabel = document.getElementById('beat-label');
  if (beatLabel) beatLabel.textContent = audioSettings.beat ? `BPM ${beatClock.bpm}` : '节拍辅助关闭';
  const squad = document.getElementById('squad-mode');
  if (squad) squad.style.display = state.running ? 'block' : 'none';
  const actions = document.getElementById('hud-actions');
  if (actions) actions.style.display = state.running ? 'flex' : 'none';
  const pause = document.getElementById('pause-btn');
  if (pause) pause.classList.toggle('active', state.paused);
}

function update(dt) {
  if (!state.running || state.paused) return;
  
  dt = Math.min(dt, 0.1); // Cap dt
  updateBeat(dt);
  state._autoEatCooldown = Math.max(0, state._autoEatCooldown - dt);
  
  // Combo timer
  if (state.comboTime > 0) {
    state.comboTime -= dt;
    if (state.comboTime <= 0) state.combo = 0;
  }
  
  // Invulnerability timer
  if (state.invulnTimer > 0) state.invulnTimer -= dt;
  
  // Shake decay
  if (state.shakeAmount > 0) state.shakeAmount = Math.max(0, state.shakeAmount - dt * 8);
  
  // Float texts
  for (let i = state.floatTexts.length - 1; i >= 0; i--) {
    const ft = state.floatTexts[i];
    ft.life -= dt;
    ft.y += ft.vy * dt;
    if (ft.life <= 0) state.floatTexts.splice(i, 1);
  }
  
  // Glutton timer
  if (state.gluttonMode) {
    state.gluttonTimer -= dt;
    if (state.gluttonTimer <= 0) state.gluttonMode = false;
  }
  
  updatePlayer(dt);
  updateAI(dt);
  updateFollowers(dt);
  updateGratitude(dt);
  checkCollisions();
  maintainAIPopulation(dt);
  updateCamera();
  updateBgParticles(dt);
  updateEatParticles(dt);
  updateHUD();
}

// ==================== RENDER ====================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  // Scale world based on screen size for mobile
  const area = canvas.width * canvas.height;
  if (area < 500000) {
    state.worldW = 1800; state.worldH = 1300;
  } else if (area < 1000000) {
    state.worldW = 2400; state.worldH = 1700;
  } else {
    state.worldW = 3000; state.worldH = 2200;
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Draw character using real image sprite ---
function drawCharacter(cx, cy, char, isPlayer) {
  const s = char.size;
  const bob = Math.sin(char.bobPhase) * (isPlayer ? 2 : 1.5);
  const isFollower = state.followers.includes(char);
  
  ctx.save();
  
  // Player glow
  if (isPlayer) {
    if (state.gluttonMode) {
      ctx.shadowColor = '#FF4500';
      ctx.shadowBlur = 24 + Math.sin(Date.now() * 0.008) * 8;
    } else if (state.gratitudeMode) {
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = 25 + Math.sin(Date.now() * 0.005) * 10;
    } else {
      ctx.shadowColor = char.accent;
      ctx.shadowBlur = 14 + Math.sin(Date.now() * 0.004) * 4;
    }
    if (state.invulnTimer > 0) {
      ctx.shadowColor = '#FFD700';
      ctx.shadowBlur = 22 + Math.sin(Date.now() * 0.006) * 6;
    }
  }
  
  // Draw image sprite
  const imgSize = s * 3.2; // scale up the 128px sprite
  const img = CHAR_IMAGE_SETS[state.skin]?.[char.level] || CHAR_IMAGE_SETS.classic[char.level];
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.95 + bob, s * 0.72, s * 0.26, 0, 0, Math.PI * 2);
  ctx.fill();
  if (isPlayer || isFollower) {
    const ringAlpha = isPlayer ? 0.2 + Math.max(0, state.invulnTimer) * 0.12 : 0.12;
    ctx.strokeStyle = isPlayer ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isPlayer ? 3 : 2;
    ctx.beginPath();
    ctx.arc(cx, cy + bob, s * (isPlayer ? 1.08 : 1.02), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = isPlayer ? `rgba(255,255,255,${ringAlpha})` : 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(cx, cy + bob, s * (isPlayer ? 1.02 : 0.98), 0, Math.PI * 2);
    ctx.fill();
  }
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, cx - imgSize/2, cy - imgSize/2 + bob, imgSize, imgSize);
  } else {
    // Fallback: colored circle
    ctx.fillStyle = char.color;
    ctx.strokeStyle = char.dark;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy + bob, s * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  
  ctx.restore();
  
  // Name label
  const labelY = cy + s * 1.12 + bob;
  const labelText = char.name;
  ctx.font = `bold ${Math.max(9, s * 0.28)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  const labelW = Math.max(30, ctx.measureText(labelText).width + 14);
  ctx.fillStyle = 'rgba(10,10,24,0.52)';
  ctx.beginPath();
  ctx.roundRect(cx - labelW / 2, labelY - 11, labelW, 18, 9);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 3;
  ctx.fillText(labelText, cx, labelY + 3);
  ctx.shadowBlur = 0;
  
  // Threat indicator for AI (not followers, not in gratitude mode)
  if (!isPlayer && !isFollower && char.level > state.playerLevel && state.running && !state.gratitudeMode) {
    ctx.strokeStyle = 'rgba(255,90,90,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy + bob, s * 1.16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// --- Draw dog head (imprisoned) ---
function drawDogHead(dh) {
  const bob = Math.sin(dh.bobPhase) * 2;
  const img = CHAR_IMAGE_SETS[state.skin]?.doghead || CHAR_IMAGE_SETS.classic.doghead;
  const imgSize = dh.size * 3.2;
  
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, dh.x - imgSize/2, dh.y - imgSize/2 + bob, imgSize, imgSize);
  } else {
    // Fallback
    ctx.fillStyle = '#8B5A2B';
    ctx.beginPath();
    ctx.arc(dh.x, dh.y + bob, dh.size * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(dh.x - dh.size*0.2, dh.y-dh.size*0.1+bob, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.arc(dh.x + dh.size*0.2, dh.y-dh.size*0.1+bob, 3, 0, Math.PI*2);
    ctx.fill();
  }
  
  // Rescue indicator
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🔓解救', dh.x, dh.y - dh.size * 1.3 + bob);
}

function drawMinimap() {
  const mmW = 100, mmH = 70, mmX = canvas.width - mmW - 12, mmY = canvas.height - mmH - 12;
  
  ctx.save();
  ctx.fillStyle = 'rgba(12,12,28,0.58)';
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(mmX, mmY, mmW, mmH, 8);
  ctx.fill();
  ctx.stroke();
  const mmGrad = ctx.createLinearGradient(mmX, mmY, mmX, mmY + mmH);
  mmGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
  mmGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mmGrad;
  ctx.beginPath();
  ctx.roundRect(mmX, mmY, mmW, mmH, 8);
  ctx.fill();
  
  // View rect
  const vx = mmX + (state.camX / state.worldW) * mmW;
  const vy = mmY + (state.camY / state.worldH) * mmH;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(vx - mmW * 0.05, vy - mmH * 0.05, mmW * 0.1, mmH * 0.1);
  
  // Player dot
  if (player) {
    const px = mmX + (player.x / state.worldW) * mmW;
    const py = mmY + (player.y / state.worldH) * mmH;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // AI dots (threats only)
  for (const ai of aiChars) {
    if (ai.level > state.playerLevel) {
      const ax = mmX + (ai.x / state.worldW) * mmW;
      const ay = mmY + (ai.y / state.worldH) * mmH;
      ctx.fillStyle = 'rgba(255,90,90,0.85)';
      ctx.beginPath();
      ctx.arc(ax, ay, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (const dh of state.dogHeads) {
    const dx = mmX + (dh.x / state.worldW) * mmW;
    const dy = mmY + (dh.y / state.worldH) * mmH;
    ctx.fillStyle = '#F5A623';
    ctx.beginPath();
    ctx.arc(dx, dy, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function render() {
  const w = canvas.width, h = canvas.height;
  const sc = SCENES.find(s => s.id === state.scene);
  
  // Clear
  ctx.fillStyle = sc.bg;
  ctx.fillRect(0, 0, w, h);
  
  if (!state.running && !state.paused) {
    const idleGrad = ctx.createRadialGradient(w * 0.5, h * 0.22, 20, w * 0.5, h * 0.35, Math.max(w, h) * 0.7);
    idleGrad.addColorStop(0, 'rgba(108,99,255,0.16)');
    idleGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = idleGrad;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 30; i++) {
      const sx = (i * 137 + 50) % w, sy = (i * 73 + 30 + Date.now() * 0.01) % h;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }
  
  ctx.save();
  
  // Camera transform with shake
  const shakeX = state.shakeAmount * (Math.random() - 0.5) * 2;
  const shakeY = state.shakeAmount * (Math.random() - 0.5) * 2;
  const camX = state.camX - w / 2 + shakeX;
  const camY = state.camY - h / 2 + shakeY;
  ctx.translate(-camX, -camY);
  
  // ===== Scene background =====
  drawSceneBg(sc, state.camX, state.camY, w, h);
  
  // ===== World border =====
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, state.worldW, state.worldH);
  
  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridSize = 150;
  for (let x = gridSize; x < state.worldW; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, state.worldH); ctx.stroke();
  }
  for (let y = gridSize; y < state.worldH; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(state.worldW, y); ctx.stroke();
  }
  const centerGlow = ctx.createRadialGradient(state.camX, state.camY, 0, state.camX, state.camY, Math.max(w, h) * 0.6);
  centerGlow.addColorStop(0, 'rgba(255,255,255,0.05)');
  centerGlow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = centerGlow;
  ctx.fillRect(camX, camY, w, h);
  
  // ===== Danger zone visual (when near higher-level AI) =====
  if (player) {
    let nearestThreat = null, nearestDist = Infinity;
    for (const ai of aiChars) {
      if (ai.level > state.playerLevel) {
        const dx = player.x - ai.x, dy = player.y - ai.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < nearestDist) { nearestDist = d; nearestThreat = ai; }
      }
    }
    if (nearestThreat && nearestDist < 250) {
      const alpha = Math.max(0, (1 - nearestDist / 250) * 0.25);
      ctx.fillStyle = `rgba(255,0,0,${alpha})`;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // ===== Draw AI characters =====
  for (const ai of aiChars) {
    drawCharacter(ai.x, ai.y, ai, false);
  }
  
  // ===== Draw dog heads =====
  for (const dh of state.dogHeads) {
    drawDogHead(dh);
  }
  
  // ===== Draw followers (trail behind player) =====
  if (state.followers.length > 0 && player) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    for (const f of state.followers) ctx.lineTo(f.x, f.y);
    ctx.stroke();
  }
  for (const f of state.followers) {
    drawCharacter(f.x, f.y, f, false);
  }
  
  // ===== Draw player =====
  if (player) {
    drawCharacter(player.x, player.y, player, true);
  }
  
  // ===== Eat particles =====
  for (const p of state.eatParticles) {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
    g.addColorStop(0, p.color);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const vignette = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.22, w / 2, h / 2, Math.max(w, h) * 0.72);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(3,4,14,0.34)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, w, h);
  
  ctx.restore();
  
  // ===== Float texts (combo, score popups) =====
  for (const ft of state.floatTexts) {
    const sx = ft.x - state.camX + w/2;
    const sy = ft.y - state.camY + h/2;
    const alpha = ft.life / ft.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 18px system-ui, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = ft.color;
    ctx.strokeStyle = 'rgba(10,10,20,0.36)';
    ctx.lineWidth = 6;
    ctx.strokeText(ft.text, sx, sy);
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(ft.text, sx, sy);
    ctx.restore();
  }
  
  // ===== Minimap (on top of everything) =====
  drawMinimap();
  
  // ===== Pause badge =====
  if (state.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 2rem "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 暂停中', w / 2, h / 2);
  }
  
}

// ==================== GAME LOOP ====================
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016;
  lastTime = timestamp;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

function initSceneSelector() {
  const grid = document.getElementById('scene-selector');
  grid.innerHTML = '';
  SCENES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn' + (s.id === state.scene ? ' active' : '');
    btn.textContent = s.name;
    btn.onclick = () => {
      state.scene = s.id;
      grid.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    grid.appendChild(btn);
  });
  const dg = document.getElementById('difficulty-selector');
  if (dg) {
    dg.innerHTML = '';
    DIFFICULTIES.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'scene-btn' + (d.id === state.difficulty ? ' active' : '');
      btn.textContent = d.name;
      btn.onclick = () => { state.difficulty = d.id; dg.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
      dg.appendChild(btn);
    });
  }
  const sg = document.getElementById('skin-selector');
  if (sg) {
    sg.innerHTML = '';
    [
      { id: 'classic', name: '经典', src: 'images/classic/raddy.png' },
      { id: 'refreshed', name: '焕新', src: 'images/raddy.png' },
    ].forEach(skin => {
      const btn = document.createElement('button');
      btn.className = 'scene-btn skin-btn' + (skin.id === state.skin ? ' active' : '');
      btn.innerHTML = `<img class="skin-thumb" src="${skin.src}" alt=""><span>${skin.name}</span>`;
      btn.onclick = () => {
        state.skin = skin.id;
        sg.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showToast(skin.id === 'classic' ? '已切换为经典形象' : '已切换为焕新形象');
      };
      sg.appendChild(btn);
    });
  }
}

function setSquadMode(mode) {
  state.squadMode = mode;
  ['follow','hunt','guard'].forEach(id => document.getElementById('mode-' + id)?.classList.toggle('active', id === mode));
  showToast(mode === 'hunt' ? '队伍进入狩猎模式' : mode === 'guard' ? '队伍进入护卫模式' : '队伍恢复跟随');
}

// ==================== GAME FLOW ====================
function startGame() {
  state.running = true;
  state.paused = false;
  state.won = false;
  state.playerLevel = 0;
  state.score = 0;
  state.combo = 0;
  state.comboTime = 0;
  state.maxCombo = 0;
  state.invulnTimer = 0;
  state.totalEats = 0;
  state.followers = [];
  state.pathHistory = [];
  state.dogHeads = [];
  state.dogRescued = 0;
  state.gratitudeMode = false;
  state.gratitudeTimer = 0;
  state.shakeAmount = 0;
  state.floatTexts = [];
  state.eatTimestamps = [];
  state.gluttonMode = false;
  state.gluttonTimer = 0;
  state.startTime = Date.now();
  state.eatParticles = [];
  state._dogSpawnTimer = 0;
  state._pathCounter = 0;
  state._autoEatCooldown = 0;
  state._aiSpawnTimer = 0;
  state._huntRetargetTimer = 0;
  beatClock.elapsed = 0; beatClock.step = 0; beatClock.pulse = 0;
  input.tapTarget = null; input.joystick.active = false;
  setSquadMode('follow');
  
  // Create player
  player = createCharacter(state.worldW / 2, state.worldH / 2, 0, true);
  
  // Spawn initial AI (safe spawn: keep distance from player)
  aiChars = [];
  const difficulty = DIFFICULTIES.find(d => d.id === state.difficulty) || DIFFICULTIES[1];
  for (let i = 0; i < difficulty.aiCount / 2; i++) spawnAI(true);
  for (let i = Math.floor(difficulty.aiCount / 2); i < difficulty.aiCount; i++) spawnAI(true);
  
  // Init background
  initBgParticles();
  
  // Reset camera
  state.camX = state.worldW / 2;
  state.camY = state.worldH / 2;
  
  // Hide menus
  hideOverlay('menu-overlay');
  hideOverlay('win-overlay');
  hideOverlay('lose-overlay');
  hideOverlay('pause-overlay');
  
  // Reset progress bar
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = '0';
  
  updateHUD();
  
  // The single global animation loop is started once in init().
  lastTime = 0;
  
  // Focus hint
  showToast('🎮 方向键/WASD 移动，F 切换队伍模式');
}

function restartGame() {
  hideOverlay('win-overlay');
  hideOverlay('lose-overlay');
  startGame();
}

function showMenu() {
  state.running = false;
  state.paused = false;
  player = null;
  aiChars = [];
  hideOverlay('win-overlay');
  hideOverlay('lose-overlay');
  hideOverlay('pause-overlay');
  showOverlay('menu-overlay');
  initSceneSelector();
  updateHUD();
}

function togglePause() {
  if (!state.running) return;
  state.paused = !state.paused;
  if (state.paused) showOverlay('pause-overlay');
  else hideOverlay('pause-overlay');
}

function showHelp() {
  showOverlay('help-overlay');
}

// ==================== LEADERBOARD ====================
const LB_KEY = 'rhythm_box_leaderboard';
function loadLB() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}
function saveToLeaderboard(won) {
  const entry = {
    score: state.score,
    level: state.playerLevel,
    levelName: LEVELS[state.playerLevel].name,
    eats: state.totalEats,
    combo: state.maxCombo,
    won,
    scene: state.scene,
    time: ((Date.now() - state.startTime) / 1000).toFixed(1),
    date: new Date().toLocaleDateString('zh-CN'),
    ts: Date.now(),
  };
  let lb = loadLB();
  // Score formula: won games first, then by score
  lb.push(entry);
  lb.sort((a, b) => {
    if (a.won && !b.won) return -1;
    if (!a.won && b.won) return 1;
    return b.score - a.score;
  });
  lb = lb.slice(0, 10);
  try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch {}
}

function showLeaderboard() {
  const lb = loadLB();
  const c = document.getElementById('lb-content');
  if (lb.length === 0) {
    c.innerHTML = '<div class="lb-empty">还没有记录哦～快去召唤平基吧！</div>';
  } else {
    const ranks = ['🥇','🥈','🥉','4','5','6','7','8','9','10'];
    const rankCls = ['rank-gold','rank-silver','rank-bronze','','','','','','',''];
    c.innerHTML = `<table class="lb-table"><thead><tr><th>#</th><th>结果</th><th>等级</th><th>得分</th><th>用时</th></tr></thead><tbody>${
      lb.map((e, i) => `<tr>
        <td class="${rankCls[i]}">${ranks[i]}</td>
        <td>${e.won ? '👑通关' : '💀'}</td>
        <td>${e.levelName}</td>
        <td>⭐${e.score}</td>
        <td>${e.time}s</td>
      </tr>`).join('')
    }</tbody></table>`;
  }
  showOverlay('lb-overlay');
}

function clearLeaderboard() {
  if (confirm('确定清空排行榜？')) {
    try { localStorage.removeItem(LB_KEY); } catch {}
    showLeaderboard();
  }
}

// ==================== INIT ====================
function init() {
  resizeCanvas();
  setupInput();
  loadAudioSettings();
  initSceneSelector();
  initBgParticles();
  updateHUD();
  
  // Close overlays on background click
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => {
      if (e.target === o && o.id !== 'menu-overlay' && o.id !== 'win-overlay' && o.id !== 'lose-overlay' && o.id !== 'pause-overlay') {
        o.classList.remove('show');
      }
    });
  });
  
  // One loop drives both updates and rendering for the lifetime of the page.
  requestAnimationFrame(gameLoop);
}

init();
</script>
