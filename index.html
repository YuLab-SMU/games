<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 游戏中心</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background: linear-gradient(145deg, #0a0a1e 0%, #12103a 40%, #1a1040 100%);
  font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #e8e0f0;
  display: flex; flex-direction: column; align-items: center;
}

/* Animated stars */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 40% 15%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 70% 30%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 60% 90%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.3), transparent),
    radial-gradient(2px 2px at 35% 40%, rgba(108,99,255,0.5), transparent),
    radial-gradient(2px 2px at 75% 45%, rgba(255,107,157,0.4), transparent);
  background-size: 200% 200%;
  animation: starDrift 20s ease-in-out infinite;
}
@keyframes starDrift {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 100% 50%; }
}

header {
  position: relative; z-index: 1;
  text-align: center; padding: 60px 20px 30px;
}
header h1 {
  font-size: 3rem; font-weight: 900;
  background: linear-gradient(135deg, #FF6B9D, #FFA94D, #FFD93D, #6C63FF);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShimmer 4s ease infinite;
  letter-spacing: 0.04em;
}
@keyframes titleShimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
header p {
  margin-top: 12px; font-size: 1.15rem;
  color: rgba(240,232,255,0.5); font-weight: 600;
}

.games {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
  width: 90%; max-width: 800px;
  padding: 10px 20px 60px;
}

.game-card {
  background: linear-gradient(145deg, rgba(30,25,60,0.8), rgba(20,18,50,0.9));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 32px 24px;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.game-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,0.25);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 40px rgba(108,99,255,0.1);
}
.game-card:active { transform: scale(0.97); }

.game-icon {
  font-size: 4rem;
  filter: drop-shadow(0 6px 15px rgba(255,200,0,0.3));
}

.game-card h2 {
  font-size: 1.6rem; font-weight: 900;
  background: linear-gradient(135deg, #FFD93D, #FF9F43);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.game-card .desc {
  font-size: 0.9rem; color: rgba(240,232,255,0.5);
  line-height: 1.6;
}

.tag-row {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}
.tag {
  font-size: 0.7rem; font-weight: 700;
  padding: 4px 10px; border-radius: 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.6);
}

/* Responsive */
@media (max-width: 700px) {
  header { padding: 40px 16px 20px; }
  header h1 { font-size: 2rem; }
  .games { grid-template-columns: 1fr; gap: 16px; padding: 0 16px 40px; }
  .game-card { padding: 24px 18px; }
  .game-icon { font-size: 3rem; }
}
</style>
</head>
<body>

<header>
  <h1>🎮 游戏中心</h1>
  <p>纯单文件 HTML，打开即玩</p>
</header>

<div class="games">
  <a class="game-card" href="summon-rhythm-box/index.html">
    <span class="game-icon">📦</span>
    <h2>召唤节奏盒子</h2>
    <p class="desc">大鱼吃小鱼风格进化游戏。控制 Sprunki 角色吃小的躲大的，三合一层层进化到平基！</p>
    <div class="tag-row">
      <span class="tag">进化合成</span>
      <span class="tag">5个场景</span>
      <span class="tag">狗头报恩</span>
      <span class="tag">暴食模式</span>
    </div>
  </a>

  <a class="game-card" href="make24/index.html">
    <span class="game-icon">🎯</span>
    <h2>24点大冒险</h2>
    <p class="desc">4张卡片通过 + − × ÷ 凑出 24。逐步配对运算，考验心算速度！</p>
    <div class="tag-row">
      <span class="tag">数学益智</span>
      <span class="tag">3套主题</span>
      <span class="tag">生存挑战</span>
      <span class="tag">排行榜</span>
    </div>
  </a>
</div>

</body>
</html>
