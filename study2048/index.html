<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>学途2048</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100vh; min-height: 100dvh;
  background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}

header {
  text-align: center; padding: 20px 16px 8px; width: 100%; max-width: 520px;
}
header h1 {
  font-size: 2rem; font-weight: 900;
  background: linear-gradient(135deg, #FFD93D, #FF9F43, #FF6B6B);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.score-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; gap: 12px;
}
.score-item {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 8px 16px;
  color: #ccc; font-size: 0.75rem; text-align: center;
  backdrop-filter: blur(8px);
}
.score-val {
  display: block; font-size: 1.2rem; font-weight: 900; color: #fff;
}

/* Game board */
.board-wrap {
  position: relative;
  width: min(90vw, 450px); aspect-ratio: 1;
  margin: 8px auto 16px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
#board {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
  gap: 2.5%;
  padding: 2.5%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
}

.cell {
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
}

.tile {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 10px;
  font-weight: 900; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  transition: left 0.12s ease, top 0.12s ease;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}
.tile.new { animation: tilePop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tile.merged { animation: tileMerge 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 2; }
@keyframes tilePop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes tileMerge { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

.tile-name {
  font-size: clamp(0.6rem, 3vw, 1rem); line-height: 1.2;
}
.tile-lv {
  font-size: clamp(0.35rem, 1.8vw, 0.55rem);
  opacity: 0.7; margin-top: 1px;
}

/* Float text (merge subtitle) */
.float-tagline {
  position: absolute; pointer-events: none; z-index: 10;
  font-weight: 800; font-size: clamp(0.6rem, 2.5vw, 0.9rem);
  color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.6), 0 2px 4px rgba(0,0,0,0.5);
  white-space: nowrap;
  animation: tagFloat 1.2s ease-out forwards;
}
@keyframes tagFloat {
  0% { opacity: 1; transform: translate(-50%, 0) scale(0.6); }
  30% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
}

/* Buttons */
.ctrl-row {
  display: flex; gap: 10px; padding: 0 16px 20px; flex-wrap: wrap; justify-content: center;
}
.btn {
  font-family: inherit; font-size: 0.9rem; font-weight: 800;
  padding: 10px 22px; border-radius: 14px; border: none; cursor: pointer;
  color: #fff; transition: all 0.2s ease;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
}
.btn:hover { background: rgba(255,255,255,0.18); }
.btn:active { transform: scale(0.95); }
.btn.primary { background: linear-gradient(135deg, #6C63FF, #4834D4); border-color: transparent; }

/* Game over overlay */
#gameover {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 100; align-items: center; justify-content: center; flex-direction: column;
}
#gameover.show { display: flex; }
#gameover .panel {
  background: rgba(25,22,55,0.95); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px; padding: 28px 24px; text-align: center;
  max-width: 340px; width: 90%; color: #e8e0f0;
}
#gameover h2 { font-size: 1.5rem; margin-bottom: 8px; color: #FFD93D; }
#gameover .big-emoji { font-size: 3rem; display: block; margin: 10px 0; }
#gameover .btn { margin-top: 12px; }

/* Responsive */
@media (max-width: 400px) {
  header h1 { font-size: 1.5rem; }
  .btn { padding: 8px 16px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<header>
  <h1>📚 学途 2048</h1>
  <div class="score-bar">
    <div class="score-item">🏆 得分<span class="score-val" id="score">0</span></div>
    <div class="score-item">🔝 最高<span class="score-val" id="best">0</span></div>
    <div class="score-item">📦 等级<span class="score-val" id="level-name">学沫</span></div>
  </div>
</header>

<div class="board-wrap" id="board-wrap">
  <div id="board"></div>
</div>

<div class="ctrl-row">
  <button class="btn primary" onclick="newGame()">🔄 新游戏</button>
  <button class="btn" onclick="undoMove()">↩ 撤销</button>
</div>

<div id="gameover">
  <div class="panel">
    <span class="big-emoji" id="go-emoji">🎉</span>
    <h2 id="go-title"></h2>
    <p id="go-sub" style="color:rgba(255,255,255,0.5);margin-bottom:12px;"></p>
    <button class="btn primary" onclick="newGame()">再来一局</button>
  </div>
</div>

<script>
// ==================== LEVELS ====================
const LEVELS = [
  { name: '学沫', tagline: '一吹就散', value: 2,    bg: '#6b6b80', fg: '#ccc' },
  { name: '学渣', tagline: '初见端倪', value: 4,    bg: '#8b7355', fg: '#eee' },
  { name: '学弱', tagline: '我还能学', value: 8,    bg: '#9b6b43', fg: '#ffe' },
  { name: '学民', tagline: '就这？',   value: 16,   bg: '#5c6b7a', fg: '#ffe' },
  { name: '学霸', tagline: '开始卷了', value: 32,   bg: '#3b5998', fg: '#fff' },
  { name: '学神', tagline: '你还学？', value: 64,   bg: '#6c3b9b', fg: '#fff' },
  { name: '学仙', tagline: '渡劫中…', value: 128,  bg: '#1a8b8b', fg: '#fff' },
  { name: '学圣', tagline: '已超神',   value: 256,  bg: '#2d8b46', fg: '#fff' },
  { name: '学王', tagline: '卷王之王', value: 512,  bg: '#e67e22', fg: '#fff' },
  { name: '学帝', tagline: '卷无可卷', value: 1024, bg: '#c0392b', fg: '#ffe' },
  { name: '学祖', tagline: '自己编书', value: 2048, bg: '#9b59b6', fg: '#fff' },
  { name: '学怪', tagline: '这人开挂', value: 4096, bg: '#f39c12', fg: '#fff', glow: true },
  { name: '学妖', tagline: '别学了🏆', value: 8192, bg: '#f1c40f', fg: '#1a1a00', glow: true },
];

// Build value → level map
const valMap = {};
LEVELS.forEach((lv, i) => { valMap[lv.value] = i; });

// ==================== STATE ====================
const SIZE = 4;
let grid = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem('study2048_best') || '0');
let gameOver = false;
let won = false;
let history = [];

const board = document.getElementById('board');
const boardWrap = document.getElementById('board-wrap');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const levelNameEl = document.getElementById('level-name');

// Build empty cells
for (let i = 0; i < SIZE * SIZE; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  board.appendChild(cell);
}

// ==================== GRID LOGIC ====================
function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }

function addRandom() {
  const empties = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empties.push([r, c]);
  
  if (empties.length === 0) return false;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  // 90% chance to spawn 学沫(2), 10% 学渣(4)
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function slide(row) {
  // Remove zeros
  let arr = row.filter(v => v !== 0);
  let merged = [];
  let scoreGain = 0;
  let mergePositions = [];
  
  for (let i = 0; i < arr.length; i++) {
    if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
      const newVal = arr[i] * 2;
      merged.push(newVal);
      scoreGain += newVal;
      mergePositions.push(merged.length - 1);
      i++; // skip next
    } else {
      merged.push(arr[i]);
    }
  }
  
  while (merged.length < SIZE) merged.push(0);
  return { row: merged, score: scoreGain, merges: mergePositions };
}

function move(direction) {
  const oldGrid = grid.map(r => [...r]);
  let totalScore = 0;
  const mergeInfo = [];
  
  for (let i = 0; i < SIZE; i++) {
    // Extract row based on direction (always read left-to-right / top-to-bottom)
    let raw;
    if (direction === 'left')  raw = grid[i];
    else if (direction === 'right') raw = [...grid[i]].reverse();
    else if (direction === 'up')    raw = [grid[0][i], grid[1][i], grid[2][i], grid[3][i]];
    else /* down */                 raw = [grid[3][i], grid[2][i], grid[1][i], grid[0][i]];
    
    const result = slide(raw);
    totalScore += result.score;
    let finalRow = result.row; // [val0, val1, val2, val3] in slide direction order
    
    // Write back to grid
    if (direction === 'left') {
      for (let j = 0; j < SIZE; j++) grid[i][j] = finalRow[j];
      result.merges.forEach(mi => mergeInfo.push({ r: i, c: mi }));
    } else if (direction === 'right') {
      const rev = [...finalRow].reverse();
      for (let j = 0; j < SIZE; j++) grid[i][j] = rev[j];
      result.merges.forEach(mi => mergeInfo.push({ r: i, c: SIZE - 1 - mi }));
    } else if (direction === 'up') {
      for (let j = 0; j < SIZE; j++) grid[j][i] = finalRow[j];
      result.merges.forEach(mi => mergeInfo.push({ r: mi, c: i }));
    } else { // down
      const rev = [...finalRow].reverse();
      for (let j = 0; j < SIZE; j++) grid[j][i] = rev[j];
      result.merges.forEach(mi => mergeInfo.push({ r: SIZE - 1 - mi, c: i }));
    }
  }
  
  // Check if anything changed
  let changed = false;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] !== oldGrid[r][c]) changed = true;
  
  if (!changed) return;
  
  history.push({ grid: oldGrid.map(r => [...r]), score });
  
  score += totalScore;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('study2048_best', bestScore);
  }
  
  addRandom();
  render(mergeInfo);
  updateHUD();
  checkGameState();
}

function canMove() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return true;
      if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
      if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
    }
  }
  return false;
}

function checkGameState() {
  if (won) return;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] >= 8192) {
        won = true;
        document.getElementById('go-emoji').textContent = '👑';
        document.getElementById('go-title').textContent = '恭喜登顶学妖！';
        document.getElementById('go-sub').textContent = '别学了，你已经无敌了 🏆';
        document.getElementById('gameover').classList.add('show');
        return;
      }
  
  if (!canMove()) {
    gameOver = true;
    document.getElementById('go-emoji').textContent = '💀';
    document.getElementById('go-title').textContent = '无路可走';
    document.getElementById('go-sub').textContent = '得分：' + score;
    document.getElementById('gameover').classList.add('show');
  }
}

function undoMove() {
  if (history.length === 0 || gameOver) return;
  const prev = history.pop();
  grid = prev.grid;
  score = prev.score;
  render();
  updateHUD();
}

// ==================== RENDER ====================
function getTilePos(r, c) {
  const rect = board.getBoundingClientRect();
  const wrapRect = boardWrap.getBoundingClientRect();
  const cellW = rect.width / SIZE;
  const cellH = rect.height / SIZE;
  const gapX = (rect.width - cellW * SIZE) / (SIZE + 1);
  const gapY = (rect.height - cellH * SIZE) / (SIZE + 1);
  return {
    left: wrapRect.left + gapX + (cellW + gapX) * c,
    top: wrapRect.top + gapY + (cellH + gapY) * r,
    w: cellW,
    h: cellH,
  };
}

let tileEls = [];

function render(mergeInfo = []) {
  // Remove old tiles
  tileEls.forEach(el => el.remove());
  tileEls = [];
  
  // Remove old float texts
  document.querySelectorAll('.float-tagline').forEach(el => el.remove());
  
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      if (v === 0) continue;
      
      const lvIdx = valMap[v];
      const lv = lvIdx !== undefined ? LEVELS[lvIdx] : null;
      
      const pos = getTilePos(r, c);
      const tile = document.createElement('div');
      tile.className = 'tile';
      const shrink = 0.9; // 90% of cell
      const marginX = pos.w * (1 - shrink) / 2;
      const marginY = pos.h * (1 - shrink) / 2;
      tile.style.left = (pos.left + marginX) + 'px';
      tile.style.top = (pos.top + marginY) + 'px';
      tile.style.width = (pos.w * shrink) + 'px';
      tile.style.height = (pos.h * shrink) + 'px';
      
      if (lv) {
        tile.style.background = lv.bg;
        tile.style.color = lv.fg;
        if (lv.glow) {
          tile.style.boxShadow = `0 0 20px ${lv.bg}, 0 0 40px ${lv.bg}44`;
        }
        
        const nameEl = document.createElement('span');
        nameEl.className = 'tile-name';
        nameEl.textContent = lv.name;
        tile.appendChild(nameEl);
        
        const lvEl = document.createElement('span');
        lvEl.className = 'tile-lv';
        lvEl.textContent = 'Lv.' + (lvIdx + 1);
        tile.appendChild(lvEl);
      } else {
        tile.style.background = '#333';
        const nameEl = document.createElement('span');
        nameEl.className = 'tile-name';
        nameEl.textContent = v;
        tile.appendChild(nameEl);
      }
      
      // Check if this tile was just merged
      const wasMerged = mergeInfo.some(m => m.r === r && m.c === c);
      if (wasMerged) tile.classList.add('merged');
      
      // New tile (just spawned)
      const isNewTile = history.length > 0;
      // Actually, we can't easily track new vs merged here without more state.
      // Let's skip the 'new' class for simplicity since merge is the key effect.
      
      document.body.appendChild(tile);
      tileEls.push(tile);
      
      // Float tagline for merged tiles
      if (wasMerged && lv && lv.tagline) {
        const ft = document.createElement('span');
        ft.className = 'float-tagline';
        ft.style.left = (pos.left + pos.w / 2) + 'px';
        ft.style.top = (pos.top) + 'px';
        ft.textContent = lv.tagline;
        ft.addEventListener('animationend', () => ft.remove());
        document.body.appendChild(ft);
      }
    }
  }
}

function updateHUD() {
  scoreEl.textContent = score;
  bestEl.textContent = bestScore;
  // Find highest tile
  let maxV = 0;
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c] > maxV) maxV = grid[r][c];
  const lvIdx = valMap[maxV];
  levelNameEl.textContent = lvIdx !== undefined ? LEVELS[lvIdx].name : '-';
}

// ==================== INPUT ====================
let swipeStartX = 0, swipeStartY = 0;
let activePointerId = null;
let swiped = false;
const SWIPE_THRESHOLD = 10;

document.addEventListener('keydown', e => {
  if (gameOver) return;
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': move('up'); e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': move('down'); e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': move('left'); e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': move('right'); e.preventDefault(); break;
  }
});

function trySwipe(clientX, clientY) {
  if (gameOver || swiped) return false;
  const dx = clientX - swipeStartX;
  const dy = clientY - swipeStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < SWIPE_THRESHOLD) return false;
  swiped = true;
  if (absDx > absDy) { move(dx > 0 ? 'right' : 'left'); }
  else { move(dy > 0 ? 'down' : 'up'); }
  return true;
}

boardWrap.addEventListener('pointerdown', e => {
  if (gameOver || !e.isPrimary) return;
  activePointerId = e.pointerId;
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
  swiped = false;
  boardWrap.setPointerCapture(e.pointerId);
});

boardWrap.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointerId) return;
  if (trySwipe(e.clientX, e.clientY)) e.preventDefault();
});

boardWrap.addEventListener('pointerup', e => {
  if (e.pointerId !== activePointerId) return;
  trySwipe(e.clientX, e.clientY);
  activePointerId = null;
});

boardWrap.addEventListener('pointercancel', e => {
  if (e.pointerId === activePointerId) activePointerId = null;
});

// ==================== D-PAD BUTTONS ====================
function setupDPad() {
  const pad = document.createElement('div');
  pad.style.cssText = `
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
    width: 140px; height: 140px; margin: 0 auto 20px; gap: 4px;
  `;
  
  const buttons = [
    { text: '▲', dir: 'up',    row: 1, col: 2 },
    { text: '◀', dir: 'left',  row: 2, col: 1 },
    { text: '▶', dir: 'right', row: 2, col: 3 },
    { text: '▼', dir: 'down',  row: 3, col: 2 },
  ];
  
  buttons.forEach(({ text, dir, row, col }) => {
    const btn = document.createElement('button');
    btn.textContent = text;
    btn.style.cssText = `
      grid-row: ${row}; grid-column: ${col};
      font-size: 1.4rem; font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      display: flex; align-items: center; justify-content: center;
      min-height: 44px;
    `;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!gameOver) move(dir);
    });
    pad.appendChild(btn);
  });
  
  // Center dot
  const center = document.createElement('div');
  center.style.cssText = 'grid-row:2;grid-column:2;display:flex;align-items:center;justify-content:center;';
  const dot = document.createElement('div');
  dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);';
  center.appendChild(dot);
  pad.appendChild(center);
  
  // Wrap in a row container
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;justify-content:center;padding:0 16px 24px;';
  wrap.appendChild(pad);
  
  document.querySelector('.ctrl-row').insertAdjacentElement('afterend', wrap);
}
setupDPad();

// ==================== GAME FLOW ====================
function newGame() {
  grid = emptyGrid();
  score = 0;
  gameOver = false;
  won = false;
  history = [];
  addRandom(); addRandom();
  render();
  updateHUD();
  document.getElementById('gameover').classList.remove('show');
  tileEls.forEach(el => el.remove());
  tileEls = [];
  document.querySelectorAll('.float-tagline').forEach(el => el.remove());
}

// ==================== INIT ====================
newGame();
bestEl.textContent = bestScore;

// Resize handler: re-render tiles
let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    tileEls.forEach(el => el.remove());
    tileEls = [];
    render();
  }, 100);
});
</script>
</body>
</html>
